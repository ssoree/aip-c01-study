da 하나에 모든 장기 작업을 동기 실행", "API Gateway integration timeout을 계속 늘림", "각 사용자별 EC2 인스턴스"], "a": 0, "why": "AgentCore Runtime은 agent용 serverless runtime으로 session isolation과 실시간/extended asynchronous agent workload를 지원하도록 설계되었습니다.", "trap": ["B/C는 장시간 agent execution을 단순 timeout 조정 문제로 취급합니다.", "D는 운영 오버헤드가 큽니다."]}, {"d": "D2", "q": "기업의 에이전트는 수백 개의 Lambda와 OpenAPI 도구를 사용할 수 있습니다. 모든 tool schema를 매 요청 프롬프트에 넣자 token 비용과 latency가 크게 증가했고 모델의 tool 선택 정확도도 떨어졌습니다. 기존 도구를 다시 작성하지 않고 관리형 방식으로 필요한 도구를 찾게 하고 싶습니다. 가장 적절한 기능은?", "o": ["AgentCore Gateway의 semantic tool selection/search를 활용해 문맥에 맞는 도구만 노출·선택합니다.", "모든 tool schema를 더 큰 system prompt에 넣습니다.", "각 도구마다 별도 FM을 Fine-tuning합니다.", "S3 Intelligent-Tiering을 활성화합니다."], "a": 0, "why": "AgentCore Gateway는 많은 도구를 통합하고 semantic tool selection을 통해 필요한 도구를 문맥에 따라 찾도록 지원하여 prompt 크기와 복잡도를 줄이는 데 적합합니다.", "trap": ["B는 현재 문제를 악화시킵니다.", "C는 도구 discovery 문제에 과도합니다.", "D는 무관합니다."]}, {"d": "D3", "q": "AgentCore Gateway는 사내 에이전트 요청을 받고 Salesforce와 내부 Lambda를 모두 도구로 제공합니다. Salesforce에는 OAuth token이 필요하고 Lambda에는 IAM 권한이 필요합니다. 개발팀은 에이전트 코드에 장기 credential을 저장하지 않고 inbound agent 인증과 outbound tool 인증을 중앙화하려 합니다. 가장 적절한 설계는?", "o": ["AgentCore Gateway/Identity의 inbound authorization 및 outbound credential 관리 기능을 사용하고 각 target에 최소 권한을 부여합니다.", "모든 OAuth token과 AWS access key를 system prompt에 넣습니다.", "Gateway를 public anonymous endpoint로 만들고 각 tool이 자체적으로만 인증합니다.", "Lambda 환경변수 하나에 모든 사용자의 Salesforce refresh token을 저장합니다."], "a": 0, "why": "AgentCore Gateway는 ingress authentication과 target별 egress authentication/credential exchange를 관리할 수 있고 Identity와 연계해 agent credential 처리를 중앙화할 수 있습니다.", "trap": ["B/D는 credential 노출과 공유 위험이 큽니다.", "C는 중앙 보안 요구와 맞지 않습니다."]}, {"d": "D1+D5", "q": "팀은 RAG 시스템의 두 버전을 비교합니다. V2는 새로운 parser와 chunking을 사용합니다. V1과 V2의 FM과 prompt는 동일합니다. V2에서 answer quality가 좋아졌지만 latency도 증가했습니다. 팀은 parser 변경이 실제 개선 원인인지 검증하고 배포 gate를 만들고 싶습니다. 가장 신뢰성 높은 평가 설계는?", "o": ["버전 고정된 대표 질문/ground truth dataset을 사용해 V1·V2를 동일 조건에서 retrieval 및 response 품질과 latency로 비교하고 acceptance threshold를 정의합니다.", "서로 다른 사용자 질문을 각 버전에 무작위로 보내 평균 만족도만 비교합니다.", "V2의 FM temperature를 낮춰 V1보다 안정적으로 보이게 합니다.", "CloudWatch 오류가 없으면 품질도 개선된 것으로 간주합니다."], "a": 0, "why": "변경 효과를 분리하려면 동일한 평가 데이터와 조건에서 retrieval/generation 및 latency를 함께 측정해야 합니다. 이후 threshold를 CI/CD gate로 사용할 수 있습니다.", "trap": ["B는 입력 차이로 결과가 교란됩니다.", "C는 비교 변수 하나를 추가합니다.", "D는 시스템 오류와 의미 품질을 혼동합니다."]}, {"d": "D1+D2+D3", "q": "보험 Agent는 Knowledge Base에서 약관을 검색하고 외부 청구 API를 AgentCore Gateway 도구로 호출합니다. 사용자는 자신의 계약에 대해서만 청구할 수 있고 1천만원 이상 청구는 사람 승인이 필요합니다. 외부 API가 timeout되면 재시도해야 하지만 동일 청구가 중복 생성되어서는 안 됩니다. 어떤 설계가 가장 적절합니까?", "o": ["retrieval authorization으로 계약 문서를 제한하고, Gateway/tool 계층에서 사용자별 청구 권한을 검증하며, 승인·재시도 상태는 Step Functions 등 상태 기반 워크플로로 관리하고 청구 API에 idempotency를 적용합니다.", "Guardrails 하나로 문서 접근, 사용자 권한, 사람 승인, 중복 방지를 모두 처리합니다.", "Agent system prompt에 모든 규칙을 작성하고 Lambda를 무한 재시도합니다.", "모든 청구를 SQS Standard로 보내고 FM이 중복 청구인지 판단합니다."], "a": 0, "why": "문제는 데이터 접근, tool authorization, human approval/retry orchestration, side-effect idempotency라는 서로 다른 신뢰 경계를 결합합니다. 각각 적합한 계층에서 통제해야 합니다.", "trap": ["B는 Guardrails 책임 범위를 과도하게 확장합니다.", "C는 보안/중복 제어를 프롬프트에 맡깁니다.", "D는 중복 side effect를 모델 판단으로 해결할 수 없습니다."]}, {"d": "D3+D4", "q": "회사는 eu-west-1에서 EU cross-Region inference profile을 호출합니다. 네트워크 팀은 interface VPC endpoint를 만들었으므로 목적지 리전별 SCP 권한은 더 이상 중요하지 않다고 주장합니다. 보안 아키텍트는 이에 반대합니다. 가장 적절한 이유는?", "o": ["VPC endpoint는 private network path를 제공하지만 cross-Region inference가 사용할 수 있는 destination Region에 대한 조직 정책/SCP 권한 문제를 자동으로 무효화하지 않기 때문입니다.", "VPC endpoint를 사용하면 cross-Region inference가 항상 global profile로 변환되기 때문입니다.", "SCP는 EC2에만 적용되고 Bedrock에는 적용되지 않기 때문입니다.", "PrivateLink는 모델 추론에 사용할 수 없기 때문입니다."], "a": 0, "why": "network path와 authorization/governance는 다른 계층입니다. PrivateLink를 구성해도 조직의 SCP가 cross-Region inference에 필요한 동작을 차단하면 호출 문제가 생길 수 있습니다.", "trap": ["B/C/D는 서비스 동작에 대한 잘못된 전제입니다."]}, {"d": "D4+D5", "q": "기업은 application inference profile을 부서별로 만들어 태그 기반 비용 추적을 하고 있습니다. 한 부서의 비 "trap": ["B는 비용은 줄일 수 있지만 문서 업데이트 후 오래된 답을 장기간 제공할 수 있습니다.", "C는 반복 결과를 재사용하지 않아 비용 최적화가 약하고 상시 용량은 과도합니다.", "D는 대화형 응답 요구를 훼손합니다."]}];

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const WRONG='aipc01_v16_wrong',STAT='aipc01_v16_stat';
const getWrong=()=>{try{return JSON.parse(localStorage.getItem(WRONG)||'[]')}catch(e){return[]}};
const setWrong=w=>{localStorage.setItem(WRONG,JSON.stringify([...new Set(w)]));refreshStats()};
const getStat=()=>{try{return JSON.parse(localStorage.getItem(STAT)||'{"c":0,"n":0}')}catch(e){return {c:0,n:0}}};

function refreshStats(){let w=getWrong(),s=getStat();$('wrongCount').textContent=w.length;$('masterRate').textContent=s.n?Math.round(s.c/s.n*100)+'%':'0%';$('wrongSummary').textContent=`현재 Professional Master 오답 ${w.length}문제. 복습에서 맞히면 자동 제거됩니다.`}
function setMode(m){['match','flash','master','skill','wrong','coverage'].forEach(x=>$(x+'Panel').classList.toggle('hidden',x!==m));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='master')resetMaster();if(m==='skill')resetSkill();if(m==='wrong')refreshStats();}

function svcPool(cat){return cat==='전체'?services:services.filter(x=>x[0]===cat)}let chosenS=null,chosenC=null;
function newMatch(){let p=shuffle(svcPool($('svcCat').value)).slice(0,+$('pairCount').value);chosenS=chosenC=null;$('matchMsg').textContent='서비스와 개념을 하나씩 선택하세요.';$('svcCards').innerHTML=shuffle(p).map(x=>`<button class="card" data-n="${x[1]}">${x[1]}</button>`).join('');$('conceptCards').innerHTML=shuffle(p).map(x=>`<button class="card" data-n="${x[1]}">${x[2]}<br><span class="muted">${x[3]}</span></button>`).join('')}
function pick(el,type){(type==='s'?$('svcCards'):$('conceptCards')).querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');if(type==='s')chosenS=el;else chosenC=el;if(chosenS&&chosenC){if(chosenS.dataset.n===chosenC.dataset.n){chosenS.classList.add('matched');chosenC.classList.add('matched');$('matchMsg').textContent='✓ 정답! '+chosenS.dataset.n}else $('matchMsg').textContent='✕ 다시 선택해 보세요.';chosenS.classList.remove('selected');chosenC.classList.remove('selected');chosenS=chosenC=null}}

let flashDeck=[];function nextFlash(){if(!flashDeck.length)flashDeck=shuffle(svcPool($('flashCat').value));let x=flashDeck.shift();$('flashCategory').textContent=x[0];$('flashName').textContent=x[1];$('flashAnswer').classList.remove('show');$('flashAnswer').innerHTML=`<b>${x[2]}</b><br><br>${x[3]}`};$('nextFlash').onclick=nextFlash;$('showFlash').onclick=()=>$('flashAnswer').classList.add('show');$('flashCat').onchange=()=>{flashDeck=[];nextFlash()};

function renderQuestion(prefix,q,set,grader){let multi=Array.isArray(q.a);$(prefix+'Explain').classList.remove('show');$(prefix+'Explain').innerHTML='';$(prefix+'Submit').classList.toggle('hidden',!multi);$(prefix+'Opts').innerHTML=q.o.map((o,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('');$(prefix+'Opts').querySelectorAll('.option').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(multi){if(set.has(i)){set.delete(i);b.classList.remove('selected')}else{set.add(i);b.classList.add('selected')}}else{set.clear();set.add(i);grader()}})}
function gradeCommon(prefix,q,set,onResult){let a=Array.isArray(q.a)?[...q.a]:[q.a],s=[...set].sort((x,y)=>x-y);a.sort((x,y)=>x-y);if(s.length!==a.length){$(prefix+'Explain').classList.add('show');$(prefix+'Explain').textContent=`정답은 ${a.length}개입니다.`;return}let ok=s.every((v,i)=>v===a[i]);$(prefix+'Opts').querySelectorAll('.option').forEach(b=>{b.disabled=true;let i=+b.dataset.i;if(a.includes(i))b.classList.add('correct');else if(set.has(i))b.classList.add('wrong')});let ans=a.map(i=>`${String.fromCharCode(65+i)}. ${q.o[i]}`).join('<br>'),trap=(q.trap||[]).map(x=>'• '+x).join('<br>');$(prefix+'Explain').innerHTML=`<b>${ok?'✓ 정답':'✕ 오답'}</b><br><br><b>정답</b><br>${ans}<br><br><b>해설</b><br>${q.why||''}${trap?`<div class="clue"><b>오답 함정</b><br>${trap}</div>`:''}`;$(prefix+'Explain').classList.add('show');if(onResult)onResult(ok)}

let mDeck=[],mCurrent=null,mSel=new Set(),mDone=0;
function masterPool(){let p=master.map((q,i)=>({...q,_id:i})),t=$('topicFilter').value;if(t!=='전체')p=p.filter(q=>(q.topics||[]).includes(t));if($('masterMode').value==='wrong'){let w=getWrong();p=p.filter(q=>w.includes(q._id))}return p}
function resetMaster(){mDeck=[];mDone=0;nextMaster()}function nextMaster(){let p=masterPool();if(!p.length){$('masterQ').textContent=$('masterMode').value==='wrong'?'해당 범위에 저장된 오답이 없습니다.':'해당 범위에 문제가 없습니다.';$('masterOpts').innerHTML='';$('masterProgress').textContent='';return}if(!mDeck.length)mDeck=$('masterOrder').value==='random'?shuffle(p):p;mCurrent=mDeck.shift();mDone++;mSel=new Set();$('masterProgress').textContent=`이번 순환 ${mDone} / ${p.length} · 남은 ${mDeck.length}`;$('masterTopics').innerHTML=(mCurrent.topics||[]).map(t=>`<span class="badge">${t}</span>`).join('');$('masterQ').textContent=mCurrent.q;renderQuestion('master',mCurrent,mSel,gradeMaster)}
function gradeMaster(){gradeCommon('master',mCurrent,mSel,ok=>{let w=getWrong(),id=mCurrent._id;if(!ok&&!w.includes(id))w.push(id);setWrong(w);let st=getStat();st.n++;if(ok)st.c++;setStat(st)})};$('masterSubmit').onclick=gradeMaster;$('nextMaster').onclick=nextMaster;['topicFilter','masterMode','masterOrder'].forEach(id=>$(id).onchange=resetMaster);

let sDeck=[],sCurrent=null,sSel=new Set(),sDone=0;function resetSkill(){sDeck=[];sDone=0;nextSkill()}function nextSkill(){if(!sDeck.length)sDeck=shuffle(skill.map((q,i)=>({...q,_id:i})));sCurrent=sDeck.shift();sDone++;sSel=new Set();$('skillProgress').textContent=`이번 순환 ${sDone} / ${skill.length}`;$('skillQ').textContent=sCurrent.q;renderQuestion('skill',sCurrent,sSel,()=>gradeCommon('skill',sCurrent,sSel))};$('skillSubmit').onclick=()=>gradeCommon('skill',sCurrent,sSel);$('nextSkill').onclick=nextSkill;

let wDeck=[],wCurrent=null,wSel=new Set(),wDone=0;function startWrong(){let ids=getWrong();wDeck=shuffle(ids.filter(i=>master[i]).map(i=>({...master[i],_id:i})));wDone=0;if(!wDeck.length){$('wrongQ').textContent='저장된 오답이 없습니다.';$('wrongOpts').innerHTML='';return}nextWrong()}function nextWrong(){if(!wDeck.length){$('wrongQ').textContent='이번 오답 복습을 완료했습니다.';$('wrongOpts').innerHTML='';$('wrongSubmit').classList.add('hidden');return}wCurrent=wDeck.shift();wDone++;wSel=new Set();$('wrongProgress').textContent=`복습 ${wDone} · 남은 ${wDeck.length}`;$('wrongQ').textContent=wCurrent.q;renderQuestion('wrong',wCurrent,wSel,gradeWrong)}function gradeWrong(){gradeCommon('wrong',wCurrent,wSel,ok=>{if(ok)setWrong(getWrong().filter(i=>i!==wCurrent._id))})};$('wrongSubmit').onclick=gradeWrong;$('startWrong').onclick=startWrong;$('clearWrong').onclick=()=>{if(confirm('오답 기록을 초기화할까요?')){setWrong([]);$('wrongQ').textContent='오답 기록을 초기화했습니다.';$('wrongOpts').innerHTML=''}};
function renderCoverage(){$('coverageList').innerHTML=concepts.map(c=>`<div><b>${c}</b><span style="float:right">${master.filter(q=>(q.topics||[]).includes(c)).length}문제</span></div>`).join('')}renderCoverage();refreshStats();newMatch();nextFlash();
</script></div></body></html>
